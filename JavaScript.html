<script>
'use strict';

/*
 * EDECS HR DASHBOARD — CLIENT-SIDE APPLICATION
 * Written in ES5-compatible syntax to prevent Google Apps Script HtmlService
 * from mangling template literals and arrow functions during transpilation.
 */

// =============================================================================
// 1. APP STATE
// =============================================================================

var AppState = (function() {
  var _state = {
    activePage:        'overview',
    overviewFilter:    { country: 'All', department: 'All' },
    natCountryFilter:  'All',
    chartCountryFilter:'All',
    chartGranularity:  'year',
    dashboardData:     null,
    isLoading:         false,
    dataLoadedAt:      null
  };
  return {
    get: function(key)       { return _state[key]; },
    set: function(key, val)  { _state[key] = val; },
    getAll: function()       { return JSON.parse(JSON.stringify(_state)); },
    setOverviewFilter: function(field, val) {
      _state.overviewFilter[field] = val;
    },
    resetOverviewFilters: function() {
      _state.overviewFilter = { country: 'All', department: 'All' };
    }
  };
})();

// =============================================================================
// 2. GAS CLIENT
// =============================================================================

var GASClient = {
  call: function(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function(resolve, reject) {
      var isSettled = false;
      var timeoutTimer = setTimeout(function() {
        if (!isSettled) {
          isSettled = true;
          reject(new Error('Timeout: "' + fnName + '" did not respond in 30s. Re-authorize the script.'));
        }
      }, 30000);

      try {
        var runner = google.script.run
          .withSuccessHandler(function(result) {
            if (isSettled) return;
            isSettled = true;
            clearTimeout(timeoutTimer);
            if (result && result.success === false) {
              reject(new Error(result.error || 'Server returned failure'));
            } else {
              resolve(result);
            }
          })
          .withFailureHandler(function(err) {
            if (isSettled) return;
            isSettled = true;
            clearTimeout(timeoutTimer);
            reject(new Error(err.message || 'Server error'));
          });

        runner[fnName].apply(runner, args);
      } catch (e) {
        if (isSettled) return;
        isSettled = true;
        clearTimeout(timeoutTimer);
        reject(new Error('GASClient.call failed for "' + fnName + '": ' + e.message));
      }
    });
  }
};

// =============================================================================
// 3. ERROR MANAGER
// =============================================================================

var ErrorManager = {
  show: function(message) {
    var banner = document.getElementById('error-banner');
    var msgEl  = document.getElementById('error-banner-message');
    if (!banner || !msgEl) return;
    msgEl.textContent = message || 'Unable to load dashboard. Please contact administrator.';
    banner.hidden = false;
  },
  hide: function() {
    var banner = document.getElementById('error-banner');
    if (banner) banner.hidden = true;
  },
  init: function() {
    var self = this;
    var btn  = document.getElementById('error-dismiss-btn');
    if (btn) btn.addEventListener('click', function() { self.hide(); });
  }
};

// =============================================================================
// 4. LOADING MANAGER
// =============================================================================

var LoadingManager = {
  hideLoadingScreen: function() {
    var screen = document.getElementById('loading-screen');
    if (screen) screen.style.cssText = 'display:none !important;';
    var app = document.getElementById('app');
    if (app) {
      app.hidden = false;
      app.removeAttribute('aria-hidden');
      app.style.visibility = 'visible';
    }
  },

  setKpiLoading: function(elementId, loading) {
    var el = document.getElementById(elementId);
    if (!el) return;
    if (loading) {
      el.classList.add('is-loading');
    } else {
      el.classList.remove('is-loading');
    }
  },

  setTableLoading: function(tbodyId, columns) {
    var tbody = document.getElementById(tbodyId);
    if (!tbody) return;
    var rows = '';
    for (var i = 0; i < 3; i++) {
      rows += '<tr><td colspan="' + columns + '">' +
              '<div class="skeleton" style="height:36px; margin:4px 8px;"></div>' +
              '</td></tr>';
    }
    tbody.innerHTML = rows;
  },

  showChartLoading: function() {
    var skeleton = document.getElementById('hiring-chart-skeleton');
    var canvas   = document.getElementById('hiring-chart');
    if (skeleton) skeleton.style.display = 'block';
    if (canvas)   canvas.style.display   = 'none';
  },

  hideChartLoading: function() {
    var skeleton = document.getElementById('hiring-chart-skeleton');
    var canvas   = document.getElementById('hiring-chart');
    if (skeleton) skeleton.style.display = 'none';
    if (canvas)   canvas.style.display   = 'block';
  }
};

// =============================================================================
// 5. ROUTER
// =============================================================================

var Router = {
  navigate: function(page) {
    var pages = ['overview', 'nationalization'];
    for (var i = 0; i < pages.length; i++) {
      var p      = pages[i];
      var pageEl = document.getElementById('page-' + p);
      var tabEl  = document.getElementById('tab-' + p);
      var active = (p === page);
      if (pageEl) {
        pageEl.hidden = !active;
        pageEl.setAttribute('aria-hidden', String(!active));
      }
      if (tabEl) {
        if (active) {
          tabEl.classList.add('is-active');
        } else {
          tabEl.classList.remove('is-active');
        }
        tabEl.setAttribute('aria-selected', String(active));
      }
    }
    AppState.set('activePage', page);
    if (page === 'overview' && MapRenderer.map) {
      setTimeout(function() { MapRenderer.map.invalidateSize(); }, 100);
    }
  },

  init: function() {
    var self = this;
    var tabs = document.querySelectorAll('.navbar__tab');
    for (var i = 0; i < tabs.length; i++) {
      (function(tab) {
        tab.addEventListener('click', function() {
          var p = tab.dataset ? tab.dataset.page : tab.getAttribute('data-page');
          if (p) self.navigate(p);
        });
      })(tabs[i]);
    }
  }
};

// =============================================================================
// 6. FILTER MANAGER
// =============================================================================

var FilterManager = {
  populateDropdown: function(selectId, options) {
    var select = document.getElementById(selectId);
    if (!select) return;
    var firstOption = select.options[0];
    select.innerHTML = '';
    if (firstOption) select.appendChild(firstOption);
    for (var i = 0; i < options.length; i++) {
      var el = document.createElement('option');
      el.value       = options[i];
      el.textContent = options[i];
      select.appendChild(el);
    }
  },

  setDropdownValue: function(selectId, value) {
    var select = document.getElementById(selectId);
    if (!select) return;
    select.value = value || 'All';
  },

  _addChange: function(id, handler) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('change', handler);
  },

  _addClick: function(id, handler) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('click', handler);
  },

  init: function(filterOptions) {
    var self = this;

    this.populateDropdown('filter-country',    filterOptions.countries   || []);
    this.populateDropdown('filter-department', filterOptions.departments || []);
    this.populateDropdown('nat-filter-country', filterOptions.countries  || []);
    this.populateDropdown('chart-filter-country', filterOptions.countries|| []);

    this._addChange('filter-country', function(e) {
      AppState.setOverviewFilter('country', e.target.value);
      OverviewCtrl.applyFilters();
    });

    this._addChange('filter-department', function(e) {
      AppState.setOverviewFilter('department', e.target.value);
      OverviewCtrl.applyFilters();
    });

    this._addClick('overview-reset-filters-btn', function() {
      AppState.resetOverviewFilters();
      self.setDropdownValue('filter-country', 'All');
      self.setDropdownValue('filter-department', 'All');
      OverviewCtrl.applyFilters();
    });

    this._addChange('nat-filter-country', function(e) {
      AppState.set('natCountryFilter', e.target.value);
      NatCtrl.applyCountryFilter(e.target.value);
    });

    this._addChange('chart-filter-country', function(e) {
      AppState.set('chartCountryFilter', e.target.value);
      ChartRenderer.reload(AppState.get('chartGranularity'), e.target.value);
    });

    var granBtns = document.querySelectorAll('.granularity-btn');
    for (var i = 0; i < granBtns.length; i++) {
      (function(btn) {
        btn.addEventListener('click', function() {
          for (var j = 0; j < granBtns.length; j++) {
            granBtns[j].classList.remove('is-active');
            granBtns[j].setAttribute('aria-pressed', 'false');
          }
          btn.classList.add('is-active');
          btn.setAttribute('aria-pressed', 'true');
          var gran = btn.dataset ? btn.dataset.granularity : btn.getAttribute('data-granularity');
          AppState.set('chartGranularity', gran);
          ChartRenderer.reload(gran, AppState.get('chartCountryFilter'));
        });
      })(granBtns[i]);
    }

    this._addClick('navbar-refresh-btn', function() {
      var btn = document.getElementById('navbar-refresh-btn');
      if (btn) {
        btn.classList.add('is-loading');
        btn.textContent = 'Refreshing...';
      }
      GASClient.call('clientRefreshCache')
        .then(function() { return App.loadDashboardData(); })
        .catch(function(e) { ErrorManager.show('Refresh failed: ' + e.message); })
        .then(function() {
          if (btn) {
            btn.classList.remove('is-loading');
            btn.innerHTML = '<span class="refresh-icon" aria-hidden="true">\u21bb</span> Refresh';
          }
        });
    });
  }
};

// =============================================================================
// 7. OVERVIEW CONTROLLER
// =============================================================================

var OverviewCtrl = {
  render: function(overview) {
    this._renderKpi(overview.headCount, overview.countryTable);
    this._renderTable('country-table-body', overview.countryTable,       'country-table-count');
    this._renderTable('dept-table-body',    overview.deptTable,          'dept-table-count');
    this._renderTable('nat-table-body',     overview.nationalityTable,   'nat-table-count');
    MapRenderer.updatePins(overview.mapPins);
  },

  applyFilters: function() {
    var self    = this;
    var filters = AppState.get('overviewFilter');
    LoadingManager.setKpiLoading('overview-headcount', true);
    LoadingManager.setTableLoading('country-table-body', 3);
    LoadingManager.setTableLoading('dept-table-body', 3);
    LoadingManager.setTableLoading('nat-table-body', 3);

    GASClient.call('getOverviewData', filters)
      .then(function(res) {
        if (!res.success) throw new Error(res.error);
        self.render(res.overview);
        var ctx = document.getElementById('overview-country-context');
        if (ctx) ctx.textContent = (filters.country !== 'All') ? filters.country : 'All Countries';
      })
      .catch(function(e) {
        ErrorManager.show('Failed to apply filters: ' + e.message);
      })
      .then(function() {
        LoadingManager.setKpiLoading('overview-headcount', false);
      });
  },

  _renderKpi: function(headCount, countryTable) {
    var el = document.getElementById('overview-headcount');
    if (el) {
      el.textContent = _formatNumber(headCount);
      el.classList.remove('is-loading');
    }
    var breakdown = document.getElementById('overview-kpi-breakdown');
    if (breakdown && countryTable && countryTable.length) {
      var top4 = countryTable.slice(0, 4);
      var html = '';
      for (var i = 0; i < top4.length; i++) {
        html += '<div style="display:flex; align-items:center; gap:6px; font-size:var(--text-xs);">' +
                '<span style="color:var(--color-text-muted);">' + _escHtml(top4[i].name) + '</span>' +
                '<span style="font-weight:700; color:var(--color-text-kpi);">' + _formatNumber(top4[i].count) + '</span>' +
                '</div>';
      }
      breakdown.innerHTML = html;
    }
  },

  _renderTable: function(tbodyId, rows, countId) {
    var tbody = document.getElementById(tbodyId);
    if (!tbody) return;

    if (!rows || rows.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3">' +
        '<div class="empty-state" style="padding:24px 0;">' +
          '<div class="empty-state__icon">\ud83d\udd0d</div>' +
          '<div class="empty-state__title">No Data Found</div>' +
          '<div class="empty-state__subtitle">Try changing filters</div>' +
        '</div></td></tr>';
      var countEl = document.getElementById(countId);
      if (countEl) countEl.textContent = '0';
      return;
    }

    var html = '';
    for (var i = 0; i < rows.length; i++) {
      html += '<tr>' +
        '<td><span class="data-table__rank">' + (i + 1) + '</span></td>' +
        '<td title="' + _escHtml(rows[i].name) + '">' + _escHtml(rows[i].name) + '</td>' +
        '<td>' + _formatNumber(rows[i].count) + '</td>' +
        '</tr>';
    }
    tbody.innerHTML = html;

    var countEl = document.getElementById(countId);
    if (countEl) countEl.textContent = _formatNumber(rows.length);
  }
};

// =============================================================================
// 8. NATIONALIZATION CONTROLLER
// =============================================================================

var NatCtrl = {
  _allCards: [],

  render: function(nat) {
    this._allCards = nat.cards || [];
    var kpiEl = document.getElementById('nat-headcount');
    if (kpiEl) {
      kpiEl.textContent = _formatNumber(nat.headCount);
      kpiEl.classList.remove('is-loading');
    }
    this._renderCards(this._allCards);
  },

  applyCountryFilter: function(countryName) {
    var filtered;
    if (countryName === 'All' || !countryName) {
      filtered = this._allCards;
    } else {
      filtered = [];
      for (var i = 0; i < this._allCards.length; i++) {
        if (this._allCards[i].countryName === countryName) {
          filtered.push(this._allCards[i]);
        }
      }
    }
    this._renderCards(filtered);
  },

  _renderCards: function(cards) {
    var grid = document.getElementById('nat-cards-grid');
    if (!grid) return;

    if (!cards || cards.length === 0) {
      grid.innerHTML = '<div style="grid-column:1/-1;">' +
        '<div class="empty-state">' +
          '<div class="empty-state__icon">\ud83d\udd0d</div>' +
          '<div class="empty-state__title">No Data Found</div>' +
          '<div class="empty-state__subtitle">Try changing the country filter</div>' +
        '</div></div>';
      return;
    }

    var html = '';
    for (var i = 0; i < cards.length; i++) {
      html += this._buildCard(cards[i]);
    }
    grid.innerHTML = html;
  },

  _buildCard: function(card) {
    var statusClass  = this._statusClass(card.status);
    var cardClass    = this._cardClass(card.status);
    var flag         = _countryFlag(card.countryName);
    var pctDisplay   = card.actualPct.toFixed(2) + '%';
    var targetDisplay= (card.targetPct !== null && card.targetPct !== undefined)
                       ? card.targetPct.toFixed(1) + '%'
                       : 'N/A';
    var varianceBadge = '';
    if (card.variance !== null && card.variance !== undefined) {
      var v    = card.variance;
      var sign = v > 0 ? '+' : '';
      var cls  = v > 0 ? 'positive' : (v < 0 ? 'negative' : 'neutral');
      varianceBadge = '<span class="nat-card__variance nat-card__variance--' + cls + '" ' +
                      'aria-label="Variance ' + sign + v.toFixed(2) + '%">' +
                      sign + v.toFixed(2) + '%</span>';
    }

    return '<article class="nat-card ' + cardClass + '" aria-label="' + _escHtml(card.countryName) + ' nationalization card">' +
      '<div class="nat-card__header">' +
        '<h3 class="nat-card__country">' + _escHtml(card.countryName) + '</h3>' +
        '<span class="nat-card__flag" aria-hidden="true">' + flag + '</span>' +
      '</div>' +
      '<div class="nat-card__pct-row">' +
        '<span class="nat-card__pct" aria-label="Nationalization rate ' + pctDisplay + '">' + pctDisplay + '</span>' +
        '<span class="nat-card__pct-label">Nationalization Rate</span>' +
        varianceBadge +
      '</div>' +
      '<div class="nat-card__stats">' +
        '<div class="nat-card__stat">' +
          '<span class="nat-card__stat-label">National</span>' +
          '<span class="nat-card__stat-value">' + _formatNumber(card.nationalCount) + '</span>' +
        '</div>' +
        '<div class="nat-card__stat">' +
          '<span class="nat-card__stat-label">Total Active</span>' +
          '<span class="nat-card__stat-value">' + _formatNumber(card.totalActive) + '</span>' +
        '</div>' +
        '<div class="nat-card__stat">' +
          '<span class="nat-card__stat-label">Target</span>' +
          '<span class="nat-card__stat-value">' + targetDisplay + '</span>' +
        '</div>' +
        '<div class="nat-card__stat">' +
          '<span class="nat-card__stat-label">Program</span>' +
          '<span class="nat-card__stat-value">' + (card.applicable ? 'Active' : 'N/A') + '</span>' +
        '</div>' +
      '</div>' +
      '<span class="nat-card__status ' + statusClass + '" role="status" aria-label="Status: ' + _escHtml(card.status) + '">' +
        _statusIcon(card.status) + ' ' + _escHtml(card.status) +
      '</span>' +
    '</article>';
  },

  _statusClass: function(status) {
    var map = {
      'Above Target': 'nat-card__status--above',
      'Near Target':  'nat-card__status--near',
      'Below Target': 'nat-card__status--below',
      'N/A':          'nat-card__status--na'
    };
    return map[status] || 'nat-card__status--na';
  },

  _cardClass: function(status) {
    var map = {
      'Above Target': 'nat-card--above-target',
      'Near Target':  'nat-card--near-target',
      'Below Target': 'nat-card--below-target',
      'N/A':          'nat-card--na'
    };
    return map[status] || 'nat-card--na';
  }
};

// =============================================================================
// 9. MAP RENDERER — Local SVG Polygon Map (Power BI Azure Maps style)
//    Zero external dependencies. Geometry from MAP_GEO_DATA (MapData.html).
//    Handles Polygon + MultiPolygon. WCAG 2.1 AA keyboard/aria support.
// =============================================================================

var MapRenderer = (function() {

  // ── Country name → ISO-3 alias map ────────────────────────────────────────
  var NAME_TO_ISO3 = {
    'Egypt':                'EGY',
    'KSA':                  'SAU',
    'Saudi Arabia':         'SAU',
    'UAE':                  'ARE',
    'United Arab Emirates': 'ARE',
    'Oman':                 'OMN',
    'Tanzania':             'TZA',
    'Angola':               'AGO'
  };

  // ── Dashboard display labels for the six target countries ─────────────────
  var ISO3_LABEL = {
    EGY: 'Egypt',
    SAU: 'Saudi Arabia',
    ARE: 'UAE',
    OMN: 'Oman',
    TZA: 'Tanzania',
    AGO: 'Angola'
  };

  // ── Label anchor offsets (lon, lat) — tuned to avoid Arabian Peninsula overlap
  var LABEL_OFFSETS = {
    EGY: { dLon:  0,    dLat:  0   },
    SAU: { dLon:  0,    dLat:  2   },
    ARE: { dLon:  5,    dLat:  4   }, // Push UAE up and right
    OMN: { dLon:  6,    dLat: -3   }, // Push Oman down and right
    TZA: { dLon:  2,    dLat:  0   },
    AGO: { dLon:  0,    dLat:  0   }
  };

  // ── Map visual constants ───────────────────────────────────────────────────
  var FILL_ACTIVE     = '#b38126';   // Required fill for highlighted countries
  var FILL_CONTEXT    = '#1c2028';   // Dark charcoal for surrounding countries
  var STROKE_CONTEXT  = '#2e3542';   // Low-contrast border
  var STROKE_ACTIVE   = '#c99a30';   // Slightly brighter bronze outline
  var STROKE_HOVER    = '#d4a017';   // Gold hover/focus outline
  var LABEL_BG        = '#0a7c8c';   // Dark teal label background
  var LABEL_FG        = '#ffffff';   // White label text

  // ── Viewport: geographic bounding box (Middle East + Africa focus) ─────────
  // A strict bounding box that perfectly maps to a 700x700 viewBox without stretching.
  var VIEW = { lonMin: -5, lonMax: 65, latMin: -25, latMax: 45 };

  // ── Internal state ─────────────────────────────────────────────────────────
  var _svg          = null;
  var _tooltip      = null;
  var _pathEls      = {};    // iso3 → <path> element
  var _activeData   = {};    // iso3 → { headCount, pct }
  var _totalActive  = 0;
  var _viewW        = 0;
  var _viewH        = 0;
  var _zoom         = 1;
  var _panX         = 0;
  var _panY         = 0;
  var _panning      = false;
  var _panStart     = null;
  var _panOrigin    = null;
  var _mapGroup     = null;  // <g> that receives zoom/pan transform
  var _pathLayer    = null;  // <g> inside _mapGroup to hold country paths
  var _labelLayer   = null;  // <g> inside _mapGroup to hold labels (always above paths)

  // ── Public interface ───────────────────────────────────────────────────────
  return {

    /**
     * Router compat: called by Router.navigate when switching to overview page.
     * SVG is responsive via viewBox — no real resize needed.
     */
    map: { invalidateSize: function() {} },

    // ── init ────────────────────────────────────────────────────────────────
    init: function() {
      var host = document.getElementById('map');
      if (!host) { console.warn('[MapRenderer] #map element not found'); return; }

      // Guard: ensure MAP_GEO_DATA was loaded by MapData.html
      if (typeof MAP_GEO_DATA === 'undefined') {
        console.error('[MapRenderer] MAP_GEO_DATA is not defined. MapData.html must be included before JavaScript.html.');
        host.innerHTML = '<div class="map-empty-state" role="status">Map data unavailable — please contact your administrator.</div>';
        return;
      }

      // Mandatory KSA / Saudi Arabia correction: Explicit assertion
      var features = MAP_GEO_DATA.features || [];
      var hasSAU = false;
      for (var f = 0; f < features.length; f++) {
        if (features[f].properties.ISO_A3 === 'SAU' || features[f].properties.NAME === 'Saudi Arabia') {
          hasSAU = true;
          // Normalize to ISO_A3 for the rest of the logic
          features[f].properties.ISO_A3 = 'SAU';
          break;
        }
      }
      if (!hasSAU) {
        var msg = '[MapRenderer] CRITICAL: Saudi Arabia (SAU) feature is missing or malformed in MapData.html.';
        console.error(msg);
        host.innerHTML = '<div class="map-empty-state" style="color:var(--color-status-danger);">' + msg + '</div>';
        return;
      }

      // Use a fixed 700x700 viewBox to preserve perfect geographic aspect ratio.
      // The CSS (#map { height: 100%; min-height: 450px }) and SVG preserveAspectRatio
      // will handle the responsive sizing without distorting the polygons.
      _viewW = 700;
      _viewH = 700;

      // Create tooltip element
      _tooltip = document.createElement('div');
      _tooltip.className = 'map-tooltip';
      _tooltip.setAttribute('role', 'tooltip');
      _tooltip.setAttribute('aria-live', 'polite');
      _tooltip.hidden = true;
      host.appendChild(_tooltip);

      // Build SVG
      _svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      _svg.setAttribute('viewBox', '0 0 ' + _viewW + ' ' + _viewH);
      _svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
      _svg.setAttribute('aria-label', 'Interactive map showing EDECS workforce distribution');
      _svg.setAttribute('role', 'img');
      _svg.style.cssText = 'display:block;width:100%;height:100%;';

      // Panning group
      _mapGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      _mapGroup.setAttribute('class', 'map-pan-group');
      
      _pathLayer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      _pathLayer.setAttribute('class', 'map-path-layer');
      _labelLayer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      _labelLayer.setAttribute('class', 'map-label-layer');
      
      _mapGroup.appendChild(_pathLayer);
      _mapGroup.appendChild(_labelLayer);
      _svg.appendChild(_mapGroup);

      // Render all country paths
      var self = this;
      for (var i = 0; i < features.length; i++) {
        var feat  = features[i];
        var props = feat.properties || {};
        var iso3  = String(props.ISO_A3 || '').trim();
        var isTarget = !!ISO3_LABEL[iso3];
        var pathD = _buildPathData(feat.geometry);
        if (!pathD) continue;

        var pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        pathEl.setAttribute('d', pathD);
        pathEl.setAttribute('fill',         isTarget ? FILL_ACTIVE   : FILL_CONTEXT);
        pathEl.setAttribute('stroke',       isTarget ? STROKE_ACTIVE : STROKE_CONTEXT);
        pathEl.setAttribute('stroke-width', isTarget ? '0.8'         : '0.4');
        pathEl.setAttribute('class',        'map-country' + (isTarget ? ' map-country--target' : ''));
        pathEl.setAttribute('data-iso3',    iso3);
        pathEl.setAttribute('data-name',    String(props.NAME || ''));

        if (isTarget) {
          // Accessibility: interactive countries are keyboard-navigable
          pathEl.setAttribute('role',       'button');
          pathEl.setAttribute('tabindex',   '0');
          pathEl.setAttribute('aria-label', (ISO3_LABEL[iso3] || iso3) + ': loading…');
          (function(el, code, displayName) {
            el.addEventListener('mouseenter', function(e) { self._onHover(e, el, code, displayName); });
            el.addEventListener('mouseleave', function()  { self._onLeave(el, code); });
            el.addEventListener('click',      function()  { self._onCountryClick(code, displayName); });
            el.addEventListener('keydown',    function(e) {
              if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                self._onCountryClick(code, displayName);
              }
            });
            el.addEventListener('focus',      function()  { self._applyHoverStyle(el, true);  });
            el.addEventListener('blur',       function()  { self._applyHoverStyle(el, false); });
          })(pathEl, iso3, ISO3_LABEL[iso3] || iso3);
        } else {
          pathEl.setAttribute('aria-hidden', 'true');
        }

        _pathLayer.appendChild(pathEl);
        if (isTarget) _pathEls[iso3] = pathEl;
      }

      // Render labels for target countries (above paths in z-order)
      this._renderLabels();

      // Zoom controls
      this._buildZoomControls(host);

      // Pan events
      this._initPan();

      host.insertBefore(_svg, host.firstChild);
    },

    // ── updatePins ──────────────────────────────────────────────────────────
    /**
     * Called by OverviewCtrl.render() and App.loadDashboardData().
     * Receives mapPins[].{countryName, headCount} from DashboardService.
     * Resolves country names via NAME_TO_ISO3 alias map.
     */
    updatePins: function(pins) {
      if (!_svg || !pins) return;
      _activeData  = {};
      _totalActive = 0;

      for (var i = 0; i < pins.length; i++) {
        var pin  = pins[i];
        var iso3 = NAME_TO_ISO3[pin.countryName];
        if (!iso3) {
          console.warn('[MapRenderer] Unknown country name: "' + pin.countryName + '" — skipped');
          continue;
        }
        _activeData[iso3] = pin.headCount || 0;
        _totalActive += pin.headCount || 0;
      }

      // Update country fill and aria-label
      for (var code in _pathEls) {
        if (!Object.prototype.hasOwnProperty.call(_pathEls, code)) continue;
        var el      = _pathEls[code];
        var count   = _activeData[code] || 0;
        var label   = ISO3_LABEL[code] || code;
        var pct     = (_totalActive > 0) ? ((count / _totalActive) * 100).toFixed(1) : '0.0';
        var active  = count > 0;

        el.setAttribute('fill',         active ? FILL_ACTIVE   : FILL_CONTEXT);
        el.setAttribute('stroke',       active ? STROKE_ACTIVE : STROKE_CONTEXT);
        el.setAttribute('stroke-width', active ? '0.8'         : '0.4');
        el.setAttribute('aria-label',   label + ': ' + _formatNumber(count) + ' active employees (' + pct + '% of total)');
      }

      // Mandatory KSA Deterministic Fill Check & Assertion
      var saudiPath = _pathEls['SAU'];
      if (saudiPath) {
        var isSaudiActive = Number(_activeData['SAU'] || 0) > 0;
        var requiredFill = isSaudiActive ? FILL_ACTIVE : FILL_CONTEXT;
        saudiPath.setAttribute('fill', requiredFill);
        saudiPath.style.fill = requiredFill;

        if (isSaudiActive) {
          // Force a reflow if necessary to catch the computed style immediately (in browser context)
          var computedFill = typeof window !== 'undefined' && window.getComputedStyle ? window.getComputedStyle(saudiPath).fill : null;
          // In some browsers computed fill is rgb(...), but we just warn if it's explicitly wrong or fallback
          if (computedFill && (computedFill.indexOf('rgb(28, 32, 40)') > -1 || computedFill === FILL_CONTEXT)) {
            console.error('[MapRenderer] CRITICAL: SAU fill assertion failed! Computed color implies it is still ' + FILL_CONTEXT);
          }
        }
      }

      // Refresh labels with real headcounts
      this._updateLabels();
    },

    // ── _renderLabels ────────────────────────────────────────────────────────
    _renderLabels: function() {
      var self = this;
      for (var iso3 in ISO3_LABEL) {
        if (!Object.prototype.hasOwnProperty.call(ISO3_LABEL, iso3)) continue;
        this._createLabel(iso3);
      }
    },

    _createLabel: function(iso3) {
      var centroid = _getCentroid(iso3);
      if (!centroid) return;

      var offset  = LABEL_OFFSETS[iso3] || { dLon: 0, dLat: 0 };
      var lon     = centroid.lon + (offset.dLon || 0);
      var lat     = centroid.lat + (offset.dLat || 0);
      var pt      = _project(lon, lat);
      var label   = ISO3_LABEL[iso3] || iso3;

      // Group for label badge
      var g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('class',       'map-label');
      g.setAttribute('data-iso3',   iso3);
      g.setAttribute('aria-hidden', 'true');
      g.setAttribute('transform',   'translate(' + pt.x + ',' + pt.y + ')');

      // Background pill — width adapts to label length.
      // "Saudi Arabia" needs ~100 SVG units; shorter names use a 56-unit minimum.
      var labelCharCount = label.length;
      var pillW = labelCharCount > 10 ? Math.max(100, labelCharCount * 7) : 56;
      var pillHalfW = pillW / 2;

      // Background pill
      var rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x',      String(-pillHalfW));
      rect.setAttribute('y',      '-9');
      rect.setAttribute('width',  String(pillW));
      rect.setAttribute('height', '18');
      rect.setAttribute('rx',     '4');
      rect.setAttribute('fill',   LABEL_BG);
      rect.setAttribute('opacity','0.92');
      g.appendChild(rect);

      // Country name text
      var txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      txt.setAttribute('x',            '0');
      txt.setAttribute('y',            '4');
      txt.setAttribute('text-anchor',  'middle');
      txt.setAttribute('fill',         LABEL_FG);
      txt.setAttribute('font-size',    '7');
      txt.setAttribute('font-weight',  '700');
      txt.setAttribute('font-family',  'Inter, system-ui, sans-serif');
      txt.setAttribute('class',        'map-label__name');
      txt.setAttribute('data-iso3',    iso3);
      txt.textContent = label;
      g.appendChild(txt);

      // Headcount text (updated by _updateLabels)
      var count = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      count.setAttribute('x',            '0');
      count.setAttribute('y',            '16');
      count.setAttribute('text-anchor',  'middle');
      count.setAttribute('fill',         '#c8e8ec');
      count.setAttribute('font-size',    '6');
      count.setAttribute('font-weight',  '400');
      count.setAttribute('font-family',  'Inter, system-ui, sans-serif');
      count.setAttribute('class',        'map-label__count');
      count.setAttribute('data-iso3',    iso3);
      count.textContent = '—';
      g.appendChild(count);

      _labelLayer.appendChild(g);
    },

    _updateLabels: function() {
      var countEls = _svg ? _svg.querySelectorAll('.map-label__count') : [];
      for (var i = 0; i < countEls.length; i++) {
        var el   = countEls[i];
        var iso3 = el.getAttribute('data-iso3');
        var cnt  = _activeData[iso3];
        el.textContent = (cnt !== undefined && cnt !== null) ? _formatNumber(cnt) : '—';
      }
      // Resize label background to fit text
      var nameEls = _svg ? _svg.querySelectorAll('.map-label__name') : [];
      for (var j = 0; j < nameEls.length; j++) {
        var nel  = nameEls[j];
        var g    = nel.parentNode;
        if (!g) continue;
        var rect = g.querySelector('rect');
        if (!rect) continue;
        try {
          var tw = nel.getComputedTextLength ? (nel.getComputedTextLength() + 10) : 44;
          var hw = Math.max(44, tw);
          rect.setAttribute('width',  String(hw));
          rect.setAttribute('x',      String(-hw / 2));
        } catch(e) { /* non-critical */ }
      }
    },

    // ── Zoom controls ────────────────────────────────────────────────────────
    _buildZoomControls: function(host) {
      var self    = this;
      var ctrl    = document.createElement('div');
      ctrl.className = 'map-zoom-controls';
      ctrl.setAttribute('aria-label', 'Map zoom controls');

      var btnIn = document.createElement('button');
      btnIn.type = 'button';
      btnIn.textContent = '+';
      btnIn.className = 'map-zoom-btn';
      btnIn.setAttribute('aria-label', 'Zoom in');
      btnIn.addEventListener('click', function() { self._applyZoom(0.25); });

      var btnOut = document.createElement('button');
      btnOut.type = 'button';
      btnOut.textContent = '−';
      btnOut.className = 'map-zoom-btn';
      btnOut.setAttribute('aria-label', 'Zoom out');
      btnOut.addEventListener('click', function() { self._applyZoom(-0.25); });

      ctrl.appendChild(btnIn);
      ctrl.appendChild(btnOut);
      host.appendChild(ctrl);
    },

    _applyZoom: function(delta) {
      _zoom = Math.max(0.6, Math.min(4, _zoom + delta));
      _applyTransform();
    },

    // ── Pan events ───────────────────────────────────────────────────────────
    _initPan: function() {
      if (!_svg) return;
      _svg.addEventListener('mousedown', function(e) {
        if (e.button !== 0) return;
        _panning  = true;
        _panStart = { x: e.clientX, y: e.clientY };
        _panOrigin = { x: _panX, y: _panY };
        _svg.style.cursor = 'grabbing';
      });
      window.addEventListener('mousemove', function(e) {
        if (!_panning) return;
        // Scale mouse pixels to SVG viewBox coordinates so panning isn't "too fast" or "too slow"
        var scaleX = _viewW / (_svg.clientWidth || _viewW);
        var scaleY = _viewH / (_svg.clientHeight || _viewH);
        var scale = Math.max(scaleX, scaleY); // approximate uniform scale
        
        _panX = _panOrigin.x + (e.clientX - _panStart.x) * scale;
        _panY = _panOrigin.y + (e.clientY - _panStart.y) * scale;
        _applyTransform();
      });
      window.addEventListener('mouseup', function() {
        _panning = false;
        if (_svg) _svg.style.cursor = '';
      });
      // Scroll wheel zoom
      _svg.addEventListener('wheel', function(e) {
        e.preventDefault();
        var delta = e.deltaY > 0 ? -0.15 : 0.15;
        _zoom = Math.max(0.6, Math.min(4, _zoom + delta));
        _applyTransform();
      }, { passive: false });
    },

    // ── Hover / focus ─────────────────────────────────────────────────────────
    _applyHoverStyle: function(el, on) {
      el.setAttribute('stroke',       on ? STROKE_HOVER : (_activeData[el.getAttribute('data-iso3')] > 0 ? STROKE_ACTIVE : STROKE_CONTEXT));
      el.setAttribute('stroke-width', on ? '1.4'        : '0.8');
      if (on && _pathLayer) {
        // Explicitly re-append within the path layer only — never touches _labelLayer
        _pathLayer.appendChild(el);
      }
    },

    _onHover: function(e, el, iso3, displayName) {
      this._applyHoverStyle(el, true);
      var count = _activeData[iso3] || 0;
      var pct   = (_totalActive > 0) ? ((count / _totalActive) * 100).toFixed(1) + '%' : 'N/A';
      var html  = '<strong>' + _escHtml(displayName) + '</strong>' +
                  '<br><span class="map-tooltip__count">' + _formatNumber(count) + '</span>' +
                  '<span class="map-tooltip__label"> active employees</span>' +
                  '<br><span class="map-tooltip__pct">' + pct + ' of total</span>';
      this._showTooltip(e, html);
    },

    _onLeave: function(el, iso3) {
      this._applyHoverStyle(el, false);
      this._hideTooltip();
    },

    _showTooltip: function(e, html) {
      if (!_tooltip) return;
      _tooltip.innerHTML = html;
      _tooltip.hidden    = false;
      var host = _tooltip.parentNode;
      var hRect = host ? host.getBoundingClientRect() : { left: 0, top: 0 };
      var tx = e.clientX - hRect.left + 12;
      var ty = e.clientY - hRect.top  - 10;
      // Keep tooltip within host bounds
      tx = Math.min(tx, (host ? host.clientWidth  : 600) - 160);
      ty = Math.max(ty, 4);
      _tooltip.style.left = tx + 'px';
      _tooltip.style.top  = ty + 'px';
    },

    _hideTooltip: function() {
      if (_tooltip) _tooltip.hidden = true;
    },

    // ── Country click ─────────────────────────────────────────────────────────
    _onCountryClick: function(iso3, displayName) {
      // Communicate selection to existing filter system.
      // The dashboard filter dropdown stores names using CONFIG.COUNTRIES values
      // (e.g. 'KSA' for Saudi Arabia). Try matching by option value = displayName
      // first, then by option value resolving to the same ISO3 code.
      var filterEl = document.getElementById('filter-country');
      if (filterEl) {
        var opts = filterEl.options;
        for (var i = 0; i < opts.length; i++) {
          var optVal = opts[i].value;
          if (optVal === displayName ||
              NAME_TO_ISO3[optVal] === iso3 ||
              optVal === iso3) {
            filterEl.value = optVal;
            AppState.setOverviewFilter('country', optVal);
            OverviewCtrl.applyFilters();
            return;
          }
        }
      }
      // If no matching filter option, log for debugging — no crash
      console.info('[MapRenderer] Country clicked: ' + displayName + ' (' + iso3 + ') — no filter match found');
    }
  }; // end return

  // ── Private projection helpers (IIFE-scoped) ───────────────────────────────

  function _project(lon, lat) {
    var x = ((lon - VIEW.lonMin) / (VIEW.lonMax - VIEW.lonMin)) * _viewW;
    var y = ((VIEW.latMax - lat) / (VIEW.latMax - VIEW.latMin)) * _viewH;
    return { x: x, y: y };
  }

  function _ringToDCmd(ring) {
    if (!ring || ring.length === 0) return '';
    var d   = '';
    var pt  = _project(ring[0][0], ring[0][1]);
    d += 'M' + pt.x.toFixed(2) + ' ' + pt.y.toFixed(2);
    for (var i = 1; i < ring.length; i++) {
      pt = _project(ring[i][0], ring[i][1]);
      d += 'L' + pt.x.toFixed(2) + ' ' + pt.y.toFixed(2);
    }
    d += 'Z';
    return d;
  }

  function _buildPathData(geometry) {
    if (!geometry) return '';
    var d = '';
    if (geometry.type === 'Polygon') {
      var coords = geometry.coordinates || [];
      for (var r = 0; r < coords.length; r++) {
        d += _ringToDCmd(coords[r]);
      }
    } else if (geometry.type === 'MultiPolygon') {
      var polys = geometry.coordinates || [];
      for (var p = 0; p < polys.length; p++) {
        var rings = polys[p] || [];
        for (var rr = 0; rr < rings.length; rr++) {
          d += _ringToDCmd(rings[rr]);
        }
      }
    }
    return d;
  }

  function _getCentroid(iso3) {
    // Approximate centroid from bounding box of the feature's coordinates
    var features = MAP_GEO_DATA.features || [];
    for (var i = 0; i < features.length; i++) {
      var f = features[i];
      if ((f.properties || {}).ISO_A3 !== iso3) continue;
      var geom = f.geometry || {};
      var coords = geom.coordinates || [];
      var lons = [], lats = [];
      _extractCoords(coords, geom.type, lons, lats);
      if (lons.length === 0) return null;
      var lonSum = 0, latSum = 0;
      for (var j = 0; j < lons.length; j++) { lonSum += lons[j]; latSum += lats[j]; }
      return { lon: lonSum / lons.length, lat: latSum / lats.length };
    }
    return null;
  }

  function _extractCoords(coords, type, lons, lats) {
    if (type === 'Polygon') {
      var ring = coords[0] || [];
      for (var i = 0; i < ring.length; i++) { lons.push(ring[i][0]); lats.push(ring[i][1]); }
    } else if (type === 'MultiPolygon') {
      for (var p = 0; p < coords.length; p++) {
        var r = (coords[p] || [])[0] || [];
        for (var k = 0; k < r.length; k++) { lons.push(r[k][0]); lats.push(r[k][1]); }
      }
    }
  }

  function _applyTransform() {
    if (!_mapGroup) return;
    var cx = _viewW / 2, cy = _viewH / 2;
    var tx = cx + (_panX) + (cx * (_zoom - 1) * -1);
    var ty = cy + (_panY) + (cy * (_zoom - 1) * -1);
    _mapGroup.setAttribute('transform',
      'translate(' + (tx - cx * _zoom + cx).toFixed(2) + ',' + (ty - cy * _zoom + cy).toFixed(2) + ')' +
      ' scale(' + _zoom.toFixed(3) + ')');
  }

})();

// =============================================================================
// 10. CHART RENDERER — Chart.js
// =============================================================================

var ChartRenderer = {
  chart: null,

  render: function(trend) {
    var canvas = document.getElementById('hiring-chart');
    if (!canvas || typeof Chart === 'undefined') return;

    if (this.chart) {
      this.chart.destroy();
      this.chart = null;
    }

    var datasets = [];
    for (var i = 0; i < trend.datasets.length; i++) {
      var ds = trend.datasets[i];
      datasets.push({
        label:           ds.label,
        data:            ds.data,
        borderColor:     ds.color,
        backgroundColor: ds.color + '18',
        borderWidth:     2.5,
        pointRadius:     0,
        pointHoverRadius:5,
        fill:            false,
        tension:         0.3
      });
    }

    var ctx = canvas.getContext('2d');
    this.chart = new Chart(ctx, {
      type: 'line',
      data: { labels: trend.labels, datasets: datasets },
      options: {
        responsive:          true,
        maintainAspectRatio: true,
        aspectRatio:         3.5,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: {
            display:  true,
            position: 'top',
            labels: {
              color:         '#A8B2C1',
              font:          { family: 'Inter, sans-serif', size: 12, weight: '600' },
              boxWidth:      14,
              padding:       16,
              usePointStyle: true,
              pointStyle:    'circle'
            }
          },
          tooltip: {
            backgroundColor: '#1A2232',
            titleColor:      '#E5C158',
            bodyColor:       '#F0F4F8',
            borderColor:     '#D4A017',
            borderWidth:     1,
            padding:         12,
            titleFont:       { family: 'Outfit, sans-serif', size: 13, weight: '700' },
            bodyFont:        { family: 'Inter, sans-serif', size: 12 },
            callbacks: {
              label: function(ctx) {
                return ' ' + ctx.dataset.label + ': ' + _formatNumber(ctx.parsed.y);
              }
            }
          }
        },
        scales: {
          x: {
            ticks: {
              color:         '#6C757D',
              font:          { size: 11 },
              maxRotation:   45,
              autoSkip:      true,
              maxTicksLimit: 20
            },
            grid: { color: 'rgba(255,255,255,0.04)', drawBorder: false }
          },
          y: {
            ticks: {
              color:    '#6C757D',
              font:     { size: 11 },
              callback: function(val) { return _formatNumber(val); }
            },
            grid:        { color: 'rgba(255,255,255,0.06)', drawBorder: false },
            beginAtZero: true
          }
        },
        animation: { duration: 600, easing: 'easeInOutQuart' }
      }
    });

    LoadingManager.hideChartLoading();
  },

  reload: function(granularity, countryFilter) {
    LoadingManager.showChartLoading();
    GASClient.call('getHiringTrend', granularity, countryFilter === 'All' ? null : countryFilter)
      .then(function(res) {
        if (!res.success) throw new Error(res.error);
        ChartRenderer.render(res.trend);
      })
      .catch(function(e) {
        LoadingManager.hideChartLoading();
        ErrorManager.show('Chart load failed: ' + e.message);
      });
  }
};

// =============================================================================
// 11. UTILITY FUNCTIONS
// =============================================================================

function _formatNumber(n) {
  if (n === null || n === undefined) return '\u2014';
  return Number(n).toLocaleString('en-US');
}

function _escHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g,  '&amp;')
    .replace(/</g,  '&lt;')
    .replace(/>/g,  '&gt;')
    .replace(/"/g,  '&quot;')
    .replace(/'/g,  '&#39;');
}

function _countryFlag(countryName) {
  var flags = {
    Egypt:    '\ud83c\uddea\ud83c\uddec',
    KSA:      '\ud83c\uddf8\ud83c\udde6',
    UAE:      '\ud83c\udde6\ud83c\uddea',
    Oman:     '\ud83c\uddf4\ud83c\uddf2',
    Tanzania: '\ud83c\uddf9\ud83c\uddff',
    Angola:   '\ud83c\udde6\ud83c\uddf4'
  };
  return flags[countryName] || '\ud83c\udf0d';
}

function _statusIcon(status) {
  var icons = {
    'Above Target': '\u2705',
    'Near Target':  '\u26a0\ufe0f',
    'Below Target': '\u274c',
    'N/A':          '\u2139\ufe0f'
  };
  return icons[status] || '\u2014';
}

function _formatTimestamp(isoString) {
  if (!isoString) return '\u2014';
  try {
    var d = new Date(isoString);
    return d.toLocaleDateString('en-GB', {
      day:    '2-digit',
      month:  'short',
      year:   'numeric',
      hour:   '2-digit',
      minute: '2-digit'
    });
  } catch (e) {
    return isoString;
  }
}

// =============================================================================
// 12. APP BOOTSTRAP
// =============================================================================

var App = {
  loadDashboardData: function() {
    return GASClient.call('getDashboardData')
      .then(function(result) {
        if (!result || !result.success) {
          throw new Error((result && result.error) || 'Server returned an invalid response');
        }

        AppState.set('dashboardData', result);

        var todayEl   = document.getElementById('navbar-today');
        var refreshEl = document.getElementById('navbar-refresh');
        var meta      = result.meta || {};

        if (todayEl)   todayEl.textContent   = meta.today    || '\u2014';
        if (refreshEl) refreshEl.textContent = _formatTimestamp(meta.loadedAt);

        FilterManager.init(result.filterOptions);
        OverviewCtrl.render(result.overview);
        NatCtrl.render(result.nationalization);

        LoadingManager.showChartLoading();
        ChartRenderer.reload('year', null);
        MapRenderer.updatePins(result.overview.mapPins);
      })
      .catch(function(e) {
        console.error('[App] loadDashboardData failed:', e.message);
        ErrorManager.show(
          'Unable to load dashboard. Please verify the Spreadsheet ID in Config.gs. Error: ' + e.message
        );
      });
  },

  init: function() {
    ErrorManager.init();
    Router.init();
    MapRenderer.init();
    return App.loadDashboardData().then(function() {
      LoadingManager.hideLoadingScreen();
    });
  }
};

// =============================================================================
// 13. ENTRY POINT
// =============================================================================

var _appInitialized = false;

function _initApp() {
  if (_appInitialized) return;
  _appInitialized = true;
  App.init().catch(function(err) {
    console.error('[App] Fatal init error:', err);
    LoadingManager.hideLoadingScreen();
    ErrorManager.show('Fatal Error: ' + err.message);
  });
}

if (document.readyState === 'complete') {
  _initApp();
} else {
  window.addEventListener('load', _initApp);
  setTimeout(function() { _initApp(); }, 500);
}
