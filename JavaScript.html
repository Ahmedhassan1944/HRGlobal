<script>
'use strict';

/*
 * EDECS HR DASHBOARD — CLIENT-SIDE APPLICATION
 * Written in ES5-compatible syntax to prevent Google Apps Script HtmlService
 * from mangling template literals and arrow functions during transpilation.
 */

// =============================================================================
// 1. APP STATE
// =============================================================================

var AppState = (function() {
  var _state = {
    activePage:        'overview',
    overviewFilter:    { country: 'All', department: 'All' },
    natCountryFilter:  'All',
    chartCountryFilter:'All',
    chartGranularity:  'year',
    dashboardData:     null,
    isLoading:         false,
    dataLoadedAt:      null
  };
  return {
    get: function(key)       { return _state[key]; },
    set: function(key, val)  { _state[key] = val; },
    getAll: function()       { return JSON.parse(JSON.stringify(_state)); },
    setOverviewFilter: function(field, val) {
      _state.overviewFilter[field] = val;
    },
    resetOverviewFilters: function() {
      _state.overviewFilter = { country: 'All', department: 'All' };
    }
  };
})();

// =============================================================================
// 2. GAS CLIENT
// =============================================================================

var GASClient = {
  call: function(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function(resolve, reject) {
      var isSettled = false;
      var timeoutTimer = setTimeout(function() {
        if (!isSettled) {
          isSettled = true;
          reject(new Error('Timeout: "' + fnName + '" did not respond in 30s. Re-authorize the script.'));
        }
      }, 30000);

      try {
        var runner = google.script.run
          .withSuccessHandler(function(result) {
            if (isSettled) return;
            isSettled = true;
            clearTimeout(timeoutTimer);
            if (result && result.success === false) {
              reject(new Error(result.error || 'Server returned failure'));
            } else {
              resolve(result);
            }
          })
          .withFailureHandler(function(err) {
            if (isSettled) return;
            isSettled = true;
            clearTimeout(timeoutTimer);
            reject(new Error(err.message || 'Server error'));
          });

        runner[fnName].apply(runner, args);
      } catch (e) {
        if (isSettled) return;
        isSettled = true;
        clearTimeout(timeoutTimer);
        reject(new Error('GASClient.call failed for "' + fnName + '": ' + e.message));
      }
    });
  }
};

// =============================================================================
// 3. ERROR MANAGER
// =============================================================================

var ErrorManager = {
  show: function(message) {
    var banner = document.getElementById('error-banner');
    var msgEl  = document.getElementById('error-banner-message');
    if (!banner || !msgEl) return;
    msgEl.textContent = message || 'Unable to load dashboard. Please contact administrator.';
    banner.hidden = false;
  },
  hide: function() {
    var banner = document.getElementById('error-banner');
    if (banner) banner.hidden = true;
  },
  init: function() {
    var self = this;
    var btn  = document.getElementById('error-dismiss-btn');
    if (btn) btn.addEventListener('click', function() { self.hide(); });
  }
};

// =============================================================================
// 4. LOADING MANAGER
// =============================================================================

var LoadingManager = {
  hideLoadingScreen: function() {
    var screen = document.getElementById('loading-screen');
    if (screen) screen.style.cssText = 'display:none !important;';
    var app = document.getElementById('app');
    if (app) {
      app.hidden = false;
      app.removeAttribute('aria-hidden');
      app.style.visibility = 'visible';
    }
  },

  setKpiLoading: function(elementId, loading) {
    var el = document.getElementById(elementId);
    if (!el) return;
    if (loading) {
      el.classList.add('is-loading');
    } else {
      el.classList.remove('is-loading');
    }
  },

  setTableLoading: function(tbodyId, columns) {
    var tbody = document.getElementById(tbodyId);
    if (!tbody) return;
    var rows = '';
    for (var i = 0; i < 3; i++) {
      rows += '<tr><td colspan="' + columns + '">' +
              '<div class="skeleton" style="height:36px; margin:4px 8px;"></div>' +
              '</td></tr>';
    }
    tbody.innerHTML = rows;
  },

  showChartLoading: function() {
    var skeleton = document.getElementById('hiring-chart-skeleton');
    var canvas   = document.getElementById('hiring-chart');
    if (skeleton) skeleton.style.display = 'block';
    if (canvas)   canvas.style.display   = 'none';
  },

  hideChartLoading: function() {
    var skeleton = document.getElementById('hiring-chart-skeleton');
    var canvas   = document.getElementById('hiring-chart');
    if (skeleton) skeleton.style.display = 'none';
    if (canvas)   canvas.style.display   = 'block';
  }
};

// =============================================================================
// 5. ROUTER
// =============================================================================

var Router = {
  navigate: function(page) {
    var pages = ['overview', 'nationalization'];
    for (var i = 0; i < pages.length; i++) {
      var p      = pages[i];
      var pageEl = document.getElementById('page-' + p);
      var tabEl  = document.getElementById('tab-' + p);
      var active = (p === page);
      if (pageEl) {
        pageEl.hidden = !active;
        pageEl.setAttribute('aria-hidden', String(!active));
      }
      if (tabEl) {
        if (active) {
          tabEl.classList.add('is-active');
        } else {
          tabEl.classList.remove('is-active');
        }
        tabEl.setAttribute('aria-selected', String(active));
      }
    }
    AppState.set('activePage', page);
    if (page === 'overview' && MapRenderer.map) {
      setTimeout(function() { MapRenderer.map.invalidateSize(); }, 100);
    }
    // When returning to the nationalization page, resize the chart so it fills
    // the now-visible container correctly without requiring any user interaction.
    if (page === 'nationalization' && ChartRenderer.chart) {
      requestAnimationFrame(function() {
        if (ChartRenderer.chart) ChartRenderer.chart.resize();
      });
    }
  },

  init: function() {
    var self = this;
    var tabs = document.querySelectorAll('.navbar__tab');
    for (var i = 0; i < tabs.length; i++) {
      (function(tab) {
        tab.addEventListener('click', function() {
          var p = tab.dataset ? tab.dataset.page : tab.getAttribute('data-page');
          if (p) self.navigate(p);
        });
      })(tabs[i]);
    }
  }
};

// =============================================================================
// 6. FILTER MANAGER
// =============================================================================

var FilterManager = {
  populateDropdown: function(selectId, options) {
    var select = document.getElementById(selectId);
    if (!select) return;
    var firstOption = select.options[0];
    select.innerHTML = '';
    if (firstOption) select.appendChild(firstOption);
    for (var i = 0; i < options.length; i++) {
      var el = document.createElement('option');
      el.value       = options[i];
      el.textContent = options[i];
      select.appendChild(el);
    }
  },

  setDropdownValue: function(selectId, value) {
    var select = document.getElementById(selectId);
    if (!select) return;
    select.value = value || 'All';
  },

  _addChange: function(id, handler) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('change', handler);
  },

  _addClick: function(id, handler) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('click', handler);
  },

  init: function(filterOptions) {
    var self = this;

    this.populateDropdown('filter-country',    filterOptions.countries   || []);
    this.populateDropdown('filter-department', filterOptions.departments || []);
    this.populateDropdown('nat-filter-country', filterOptions.countries  || []);
    this.populateDropdown('chart-filter-country', filterOptions.countries|| []);

    if (this._initialized) return;
    this._initialized = true;

    this._addChange('filter-country', function(e) {
      AppState.setOverviewFilter('country', e.target.value);
      OverviewCtrl.applyFilters();
    });

    this._addChange('filter-department', function(e) {
      AppState.setOverviewFilter('department', e.target.value);
      OverviewCtrl.applyFilters();
    });

    FilterManager.resetOverviewFilters = function() {
      AppState.resetOverviewFilters();
      self.setDropdownValue('filter-country', 'All');
      self.setDropdownValue('filter-department', 'All');
      OverviewCtrl.applyFilters();
    };

    this._addClick('overview-reset-filters-btn', FilterManager.resetOverviewFilters);
    this._addClick('map-reset-filters-btn', FilterManager.resetOverviewFilters);

    this._addChange('nat-filter-country', function(e) {
      AppState.set('natCountryFilter', e.target.value);
      NatCtrl.applyCountryFilter(e.target.value);
    });

    this._addChange('chart-filter-country', function(e) {
      AppState.set('chartCountryFilter', e.target.value);
      ChartRenderer.reload(AppState.get('chartGranularity'), e.target.value);
    });

    var granBtns = document.querySelectorAll('.granularity-btn');
    for (var i = 0; i < granBtns.length; i++) {
      (function(btn) {
        btn.addEventListener('click', function() {
          for (var j = 0; j < granBtns.length; j++) {
            granBtns[j].classList.remove('is-active');
            granBtns[j].setAttribute('aria-pressed', 'false');
          }
          btn.classList.add('is-active');
          btn.setAttribute('aria-pressed', 'true');
          var gran = btn.dataset ? btn.dataset.granularity : btn.getAttribute('data-granularity');
          AppState.set('chartGranularity', gran);
          ChartRenderer.reload(gran, AppState.get('chartCountryFilter'));
        });
      })(granBtns[i]);
    }

    this._addClick('navbar-refresh-btn', function() {
      var btn = document.getElementById('navbar-refresh-btn');
      if (btn) {
        btn.classList.add('is-loading');
        btn.textContent = 'Refreshing...';
      }
      GASClient.call('clientRefreshCache')
        .then(function() { return App.loadDashboardData(); })
        .catch(function(e) { ErrorManager.show('Refresh failed: ' + e.message); })
        .then(function() {
          if (btn) {
            btn.classList.remove('is-loading');
            btn.innerHTML = '<span class="refresh-icon" aria-hidden="true">\u21bb</span> Refresh';
          }
        });
    });
  }
};

// =============================================================================
// 7. OVERVIEW CONTROLLER
// =============================================================================

var OverviewCtrl = {
  render: function(overview) {
    this._renderKpi(overview.headCount, overview.countryTable);
    this._renderTable('country-table-body', overview.countryTable,       'country-table-count');
    this._renderTable('dept-table-body',    overview.deptTable,          'dept-table-count');
    this._renderTable('nat-table-body',     overview.nationalityTable,   'nat-table-count');
    MapRenderer.updatePins(overview.mapPins);
  },

  _applyFiltersTimeout: null,
  _applyFiltersSeq: 0,

  applyFilters: function() {
    var self    = this;
    var filters = AppState.get('overviewFilter');
    var currentSeq = ++this._applyFiltersSeq;

    if (this._applyFiltersTimeout) clearTimeout(this._applyFiltersTimeout);

    // Debounce to coalesce rapid UI changes (e.g., country + department selected rapidly)
    this._applyFiltersTimeout = setTimeout(function() {
      LoadingManager.setKpiLoading('overview-headcount', true);
      LoadingManager.setTableLoading('country-table-body', 3);
      LoadingManager.setTableLoading('dept-table-body', 3);
      LoadingManager.setTableLoading('nat-table-body', 3);

      GASClient.call('getOverviewData', filters)
        .then(function(res) {
          // Race-safe guard: ignore stale responses
          if (self._applyFiltersSeq !== currentSeq) return;
          if (!res.success) throw new Error(res.error);
          self.render(res.overview);
          var ctx = document.getElementById('overview-country-context');
          if (ctx) ctx.textContent = (filters.country !== 'All') ? filters.country : 'All Countries';
        })
        .catch(function(e) {
          if (self._applyFiltersSeq !== currentSeq) return;
          ErrorManager.show('Failed to apply filters: ' + e.message);
        })
        .then(function() {
          if (self._applyFiltersSeq !== currentSeq) return;
          LoadingManager.setKpiLoading('overview-headcount', false);
        });
    }, 150); // 150ms debounce
  },

  _renderKpi: function(headCount, countryTable) {
    var el = document.getElementById('overview-headcount');
    if (el) {
      el.textContent = _formatNumber(headCount);
      el.classList.remove('is-loading');
    }
    var breakdown = document.getElementById('overview-kpi-breakdown');
    if (breakdown && countryTable && countryTable.length) {
      var top4 = countryTable.slice(0, 4);
      var html = '';
      for (var i = 0; i < top4.length; i++) {
        html += '<div style="display:flex; align-items:center; gap:6px; font-size:var(--text-xs);">' +
                '<span style="color:var(--color-text-muted);">' + _escHtml(top4[i].name) + '</span>' +
                '<span style="font-weight:700; color:var(--color-text-kpi);">' + _formatNumber(top4[i].count) + '</span>' +
                '</div>';
      }
      breakdown.innerHTML = html;
    }
  },

  _renderTable: function(tbodyId, rows, countId) {
    var tbody = document.getElementById(tbodyId);
    if (!tbody) return;

    var total = (rows && rows.length) ? rows.length : 0;

    // Update aria-label for screen-reader users.
    var tableEl = tbody.closest('table');
    if (tableEl) {
      tableEl.setAttribute('aria-label',
        total + ' records. ' + (total > 6 ? 'Scroll to see all.' : ''));
    }

    // Locate the scroll container once — used for overflow-y and scrollTop below.
    var bodyEl = tbody.closest('.table-card__body');

    if (!rows || rows.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3">' +
        '<div class="empty-state" style="padding:24px 0;">' +
          '<div class="empty-state__icon">\ud83d\udd0d</div>' +
          '<div class="empty-state__title">No Data Found</div>' +
          '<div class="empty-state__subtitle">Try changing filters</div>' +
        '</div></td></tr>';
      // No scrollbar needed when there is no data.
      if (bodyEl) { bodyEl.style.overflowY = 'hidden'; bodyEl.scrollTop = 0; }
      var countEl = document.getElementById(countId);
      if (countEl) countEl.textContent = '0';
      return;
    }

    // Render ALL rows into the DOM. The CSS fixed-height container clips the
    // view to 6 rows; the user scrolls inside the card to reach the rest.
    var html = '';
    for (var i = 0; i < rows.length; i++) {
      html += '<tr>' +
        '<td><span class="data-table__rank">' + (i + 1) + '</span></td>' +
        '<td title="' + _escHtml(rows[i].name) + '">' + _escHtml(rows[i].name) + '</td>' +
        '<td>' + _formatNumber(rows[i].count) + '</td>' +
        '</tr>';
    }
    tbody.innerHTML = html;

    // Conditional scrollbar: show only when content overflows 6 rows.
    // overflow-y:'hidden' removes the scrollbar track for tables with ≤ 6 rows.
    // overflow-y:'auto'   shows the scrollbar only when rows exceed the viewport.
    if (bodyEl) {
      bodyEl.style.overflowY = rows.length > 6 ? 'auto' : 'hidden';
      bodyEl.scrollTop = 0;
    }

    // Badge: total record count only — no "6 of N shown", no "Top 6".
    var countEl = document.getElementById(countId);
    if (countEl) countEl.textContent = _formatNumber(rows.length);
  }
};

// =============================================================================
// 8. NATIONALIZATION CONTROLLER
// =============================================================================

var NatCtrl = {
  _allCards: [],

  render: function(nat) {
    this._allCards = nat.cards || [];
    var kpiEl = document.getElementById('nat-headcount');
    if (kpiEl) {
      kpiEl.textContent = _formatNumber(nat.headCount);
      kpiEl.classList.remove('is-loading');
    }
    this._renderCards(this._allCards);
  },

  applyCountryFilter: function(countryName) {
    var filtered;
    if (countryName === 'All' || !countryName) {
      filtered = this._allCards;
    } else {
      filtered = [];
      for (var i = 0; i < this._allCards.length; i++) {
        if (this._allCards[i].countryName === countryName) {
          filtered.push(this._allCards[i]);
        }
      }
    }
    this._renderCards(filtered);
  },

  _renderCards: function(cards) {
    var grid = document.getElementById('nat-cards-grid');
    if (!grid) return;

    if (!cards || cards.length === 0) {
      grid.innerHTML = '<div style="grid-column:1/-1;">' +
        '<div class="empty-state">' +
          '<div class="empty-state__icon">\ud83d\udd0d</div>' +
          '<div class="empty-state__title">No Data Found</div>' +
          '<div class="empty-state__subtitle">Try changing the country filter</div>' +
        '</div></div>';
      return;
    }

    var html = '';
    for (var i = 0; i < cards.length; i++) {
      html += this._buildCard(cards[i]);
    }
    grid.innerHTML = html;
  },

  _buildCard: function(card) {
    var statusClass  = this._statusClass(card.status);
    var cardClass    = this._cardClass(card.status);
    var flag         = _countryFlag(card.countryName);
    var pctDisplay   = card.actualPct.toFixed(2) + '%';
    var targetDisplay= (card.targetPct !== null && card.targetPct !== undefined)
                       ? card.targetPct.toFixed(1) + '%'
                       : 'N/A';
    var varianceBadge = '';
    if (card.variance !== null && card.variance !== undefined) {
      var v    = card.variance;
      var sign = v > 0 ? '+' : '';
      var cls  = v > 0 ? 'positive' : (v < 0 ? 'negative' : 'neutral');
      varianceBadge = '<span class="nat-card__variance nat-card__variance--' + cls + '" ' +
                      'aria-label="Variance ' + sign + v.toFixed(2) + '%">' +
                      sign + v.toFixed(2) + '%</span>';
    }

    return '<article class="nat-card ' + cardClass + '" aria-label="' + _escHtml(card.countryName) + ' nationalization card">' +
      '<div class="nat-card__header">' +
        '<h3 class="nat-card__country">' + _escHtml(card.countryName) + '</h3>' +
        '<span class="nat-card__flag" aria-hidden="true">' + flag + '</span>' +
      '</div>' +
      '<div class="nat-card__pct-row">' +
        '<span class="nat-card__pct" aria-label="Nationalization rate ' + pctDisplay + '">' + pctDisplay + '</span>' +
        '<span class="nat-card__pct-label">Nationalization Rate</span>' +
        varianceBadge +
      '</div>' +
      '<div class="nat-card__stats">' +
        '<div class="nat-card__stat">' +
          '<span class="nat-card__stat-label">National</span>' +
          '<span class="nat-card__stat-value">' + _formatNumber(card.nationalCount) + '</span>' +
        '</div>' +
        '<div class="nat-card__stat">' +
          '<span class="nat-card__stat-label">Total Active</span>' +
          '<span class="nat-card__stat-value">' + _formatNumber(card.totalActive) + '</span>' +
        '</div>' +
        '<div class="nat-card__stat">' +
          '<span class="nat-card__stat-label">Target</span>' +
          '<span class="nat-card__stat-value">' + targetDisplay + '</span>' +
        '</div>' +
        '<div class="nat-card__stat">' +
          '<span class="nat-card__stat-label">Program</span>' +
          '<span class="nat-card__stat-value">' + (card.applicable ? 'Active' : 'N/A') + '</span>' +
        '</div>' +
      '</div>' +
      '<span class="nat-card__status ' + statusClass + '" role="status" aria-label="Status: ' + _escHtml(card.status) + '">' +
        _statusIcon(card.status) + ' ' + _escHtml(card.status) +
      '</span>' +
    '</article>';
  },

  _statusClass: function(status) {
    var map = {
      'Above Target': 'nat-card__status--above',
      'Near Target':  'nat-card__status--near',
      'Below Target': 'nat-card__status--below',
      'N/A':          'nat-card__status--na'
    };
    return map[status] || 'nat-card__status--na';
  },

  _cardClass: function(status) {
    var map = {
      'Above Target': 'nat-card--above-target',
      'Near Target':  'nat-card--near-target',
      'Below Target': 'nat-card--below-target',
      'N/A':          'nat-card--na'
    };
    return map[status] || 'nat-card--na';
  }
};

// =============================================================================
// 9. MAP RENDERER — Local SVG Polygon Map (Power BI Azure Maps style)
//    Zero external dependencies. Geometry from MAP_GEO_DATA (MapData.html).
//    Handles Polygon + MultiPolygon. WCAG 2.1 AA keyboard/aria support.
// =============================================================================

var MapRenderer = (function() {

  // ── Country name → ISO-3 alias map ────────────────────────────────────────
  var NAME_TO_ISO3 = {
    'Egypt':                'EGY',
    'KSA':                  'SAU',
    'Saudi Arabia':         'SAU',
    'UAE':                  'ARE',
    'United Arab Emirates': 'ARE',
    'Oman':                 'OMN',
    'Tanzania':             'TZA',
    'Angola':               'AGO'
  };

  // ── Dashboard display labels for the six target countries ─────────────────
  var ISO3_LABEL = {
    EGY: 'Egypt',
    SAU: 'Saudi Arabia',
    ARE: 'UAE',
    OMN: 'Oman',
    TZA: 'Tanzania',
    AGO: 'Angola'
  };

  // ── Label anchor offsets (lon, lat) — tuned to avoid Arabian Peninsula overlap
  var LABEL_OFFSETS = {
    EGY: { dLon:  0,    dLat:  0   },
    SAU: { dLon:  0,    dLat:  2   },
    ARE: { dLon:  5,    dLat:  4   }, // Push UAE up and right
    OMN: { dLon:  6,    dLat: -3   }, // Push Oman down and right
    TZA: { dLon:  2,    dLat:  0   },
    AGO: { dLon:  0,    dLat:  0   }
  };

  // ── Map visual constants ───────────────────────────────────────────────────
  var FILL_ACTIVE     = '#b38126';   // Required fill for highlighted countries
  var FILL_CONTEXT    = '#1c2028';   // Dark charcoal for surrounding countries
  var STROKE_CONTEXT  = '#2e3542';   // Low-contrast border
  var STROKE_ACTIVE   = '#c99a30';   // Slightly brighter bronze outline
  var STROKE_HOVER    = '#d4a017';   // Gold hover/focus outline
  var LABEL_BG        = '#0a7c8c';   // Dark teal label background
  var LABEL_FG        = '#ffffff';   // White label text

  // ── Viewport: geographic bounding box (Middle East + Africa focus) ─────────
  // A strict bounding box that perfectly maps to a 700x700 viewBox without stretching.
  var VIEW = { lonMin: -5, lonMax: 65, latMin: -25, latMax: 45 };

  // ── Internal state ─────────────────────────────────────────────────────────
  var _svg          = null;
  var _tooltip      = null;
  var _pathEls      = {};    // iso3 → <path> element
  var _activeData   = {};    // iso3 → { headCount, pct }
  var _totalActive  = 0;
  var _viewW        = 0;
  var _viewH        = 0;
  var _zoom         = 1;
  var _panX         = 0;
  var _panY         = 0;
  var _panning      = false;
  var _panStart     = null;
  var _panOrigin    = null;
  var _mapGroup     = null;  // <g> that receives zoom/pan transform
  var _pathLayer    = null;  // <g> inside _mapGroup to hold country paths
  var _labelLayer   = null;  // <g> inside _mapGroup to hold labels (always above paths)

  // ── Public interface ───────────────────────────────────────────────────────
  return {

    /**
     * Router compat: called by Router.navigate when switching to overview page.
     * SVG is responsive via viewBox — no real resize needed.
     */
    map: { invalidateSize: function() {} },

    // ── init ────────────────────────────────────────────────────────────────
    init: function() {
      var host = document.getElementById('map');
      if (!host) { console.warn('[MapRenderer] #map element not found'); return; }

      // Guard: ensure MAP_GEO_DATA was loaded by MapData.html
      if (typeof MAP_GEO_DATA === 'undefined') {
        console.error('[MapRenderer] MAP_GEO_DATA is not defined. MapData.html must be included before JavaScript.html.');
        host.innerHTML = '<div class="map-empty-state" role="status">Map data unavailable — please contact your administrator.</div>';
        return;
      }

      // Mandatory KSA / Saudi Arabia correction: Explicit assertion
      var features = MAP_GEO_DATA.features || [];
      var hasSAU = false;
      for (var f = 0; f < features.length; f++) {
        if (features[f].properties.ISO_A3 === 'SAU' || features[f].properties.NAME === 'Saudi Arabia') {
          hasSAU = true;
          // Normalize to ISO_A3 for the rest of the logic
          features[f].properties.ISO_A3 = 'SAU';
          break;
        }
      }
      if (!hasSAU) {
        var msg = '[MapRenderer] CRITICAL: Saudi Arabia (SAU) feature is missing or malformed in MapData.html.';
        console.error(msg);
        host.innerHTML = '<div class="map-empty-state" style="color:var(--color-status-danger);">' + msg + '</div>';
        return;
      }

    updatePins: function(pins) {

    _createLabel: function(iso3) {

  function _project(lon, lat) {
    var x = ((lon - VIEW.lonMin) / (VIEW.lonMax - VIEW.lonMin)) * _viewW;
    var y = ((VIEW.latMax - lat) / (VIEW.latMax - VIEW.latMin)) * _viewH;

      pt = _project(ring[i][0], ring[i][1]);

    d += 'Z';
    return d;

    if (!geometry) return '';

      var coords = geometry.coordinates || [];
      for (var r = 0; r < coords.length; r++) {
        d += _ringToDCmd(coords[r]);
      }
    } else if (geometry.type === 'MultiPolygon') {
      var polys = geometry.coordinates || [];
      for (var p = 0; p < polys.length; p++) {
        var rings = polys[p] || [];
        for (var rr = 0; rr < rings.length; rr++) {
          d += _ringToDCmd(rings[rr]);
        }
      }

    return d;
  }

  function _getCentroid(iso3) {
    // Approximate centroid from bounding box of the feature's coordinates
    var features = MAP_GEO_DATA.features || [];

      var f = features[i];
      if ((f.properties || {}).ISO_A3 !== iso3) continue;

      var lons = [], lats = [];
      _extractCoords(coords, geom.type, lons, lats);

      var lonSum = 0, latSum = 0;
      for (var j = 0; j < lons.length; j++) { lonSum += lons[j]; latSum += lats[j]; }
      return { lon: lonSum / lons.length, lat: latSum / lats.length };
    }
    return null;
  }

  function _extractCoords(coords, type, lons, lats) {
    if (type === 'Polygon') {
      var ring = coords[0] || [];
      for (var i = 0; i < ring.length; i++) { lons.push(ring[i][0]); lats.push(ring[i][1]); }

      for (var p = 0; p < coords.length; p++) {
        var r = (coords[p] || [])[0] || [];
        for (var k = 0; k < r.length; k++) { lons.push(r[k][0]); lats.push(r[k][1]); }

var ChartRenderer = {
  chart: null,

  render: function(trend) {
    var canvas = document.getElementById('hiring-chart');
    if (!canvas || typeof Chart === 'undefined') return;

    // Destroy any existing instance first (idempotent)
    if (this.chart) {
      this.chart.destroy();
      this.chart = null;
    }

    // Make the canvas visible BEFORE Chart.js instantiates so it can read
    // real clientWidth/clientHeight from the laid-out DOM. If the canvas is
    // hidden (display:none) at construction time Chart.js measures 0 px,
    // bakes that into the chart, and the chart appears collapsed or
    // incorrectly sized until the next resize event (which previously only
    // fired on user interaction).

    if (skeleton) skeleton.style.display = 'none';
    canvas.style.display = 'block';

      var ds = trend.datasets[i];
      datasets.push({
        label:           ds.label,
        data:            ds.data,
        borderColor:     ds.color,
        backgroundColor: ds.color + '18',
        borderWidth:     2.5,
        pointRadius:     0,
        pointHoverRadius:5,
        fill:            false,
        tension:         0.3

    }

    this.chart = new Chart(ctx, {
      type: 'line',
      data: { labels: trend.labels, datasets: datasets },
      options: {
        responsive:          true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: {
            display:  true,
            position: 'top',
            labels: {
              color:         '#A8B2C1',
              font:          { family: 'Inter, sans-serif', size: 12, weight: '600' },
              boxWidth:      14,
              padding:       16,
              usePointStyle: true,
              pointStyle:    'circle'
            }
          },
          tooltip: {
            backgroundColor: '#1A2232',
            titleColor:      '#E5C158',
            bodyColor:       '#F0F4F8',
            borderColor:     '#D4A017',
            borderWidth:     1,
            padding:         12,
            titleFont:       { family: 'Outfit, sans-serif', size: 13, weight: '700' },
            bodyFont:        { family: 'Inter, sans-serif', size: 12 },
            callbacks: {
              label: function(ctx) {
                return ' ' + ctx.dataset.label + ': ' + _formatNumber(ctx.parsed.y);
              }
            }
          }
        },
        scales: {
          x: {
            ticks: {
              color:         '#6C757D',
              font:          { size: 11 },
              maxRotation:   45,
              autoSkip:      true,
              maxTicksLimit: 20
            },
            grid: { color: 'rgba(255,255,255,0.04)', drawBorder: false }
          },
          y: {
            ticks: {
              color:    '#6C757D',
              font:     { size: 11 },
              callback: function(val) { return _formatNumber(val); }
            },
            grid:        { color: 'rgba(255,255,255,0.06)', drawBorder: false },
            beginAtZero: true
          }
        },
        animation: { duration: 600, easing: 'easeInOutQuart' }
      }
    });

    // LoadingManager.hideChartLoading() would set canvas display:block — already
    // done above before chart creation. Call it to keep the state machine consistent
    // (hides skeleton; canvas is already visible).
    LoadingManager.hideChartLoading();

    // Safety net: request a resize on the next layout frame in case the container
    // was still transitioning dimensions at construction time (e.g. skeleton
    // collapse causes a layout reflow that changes the parent width).
    var chartRef = this.chart;
    requestAnimationFrame(function() {
      if (chartRef) chartRef.resize();
    });
  },

  _reloadSeq: 0,
  _reloadTimeout: null,

  reload: function(granularity, countryFilter) {
    var self = this;
    var currentSeq = ++this._reloadSeq;

    if (this._reloadTimeout) clearTimeout(this._reloadTimeout);

    // Debounce to prevent multiple requests when changing gran + country rapidly
    this._reloadTimeout = setTimeout(function() {
      LoadingManager.showChartLoading();
      GASClient.call('getHiringTrend', granularity, countryFilter === 'All' ? null : countryFilter)
        .then(function(res) {
          if (self._reloadSeq !== currentSeq) return; // Stale response guard
          if (!res.success) throw new Error(res.error);
          self.render(res.trend);
        })
        .catch(function(e) {
          if (self._reloadSeq !== currentSeq) return;
          LoadingManager.hideChartLoading();
          ErrorManager.show('Chart load failed: ' + e.message);
        });
    }, 150);
  }
};

// =============================================================================
// 11. UTILITY FUNCTIONS
// =============================================================================

function _formatNumber(n) {
  if (n === null || n === undefined) return '\u2014';
  return Number(n).toLocaleString('en-US');
}

function _escHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g,  '&amp;')
    .replace(/</g,  '&lt;')
    .replace(/>/g,  '&gt;')
    .replace(/"/g,  '&quot;')
    .replace(/'/g,  '&#39;');
}

/**
 * Returns a deterministic inline SVG flag for the six dashboard countries.
 * No Unicode regional-indicator emoji, no external resources, no CDN.
 * Each flag is a 24×16 SVG with explicit fills.
 * Falls back to a neutral local SVG world icon for unknown country names.
 *
 * @param  {string} countryName  The display name from DashboardService
 * @returns {string}             An <svg> HTML string, always aria-hidden="true"
 */
function _countryFlag(countryName) {
  // Canonical name → ISO-3166-1 alpha-2 mapping for the six dashboard countries.
  // KSA is an accepted data alias for Saudi Arabia (ISO2: SA).
  var NAME_TO_ISO2 = {
    'Egypt':        'EG',
    'Saudi Arabia': 'SA',
    'KSA':          'SA',
    'UAE':          'AE',
    'Oman':         'OM',
    'Tanzania':     'TZ',
    'Angola':       'AO'
  };

  // Inline SVG flags — viewBox="0 0 24 16", explicit fills, no emoji font.
  // Each entry is the inner SVG content (rects/paths only; wrapper added below).
  var FLAG_SVG = {
    // Egypt: horizontal tricolour Red/White/Black + golden eagle (simplified)
    'EG': '<rect width="24" height="6" fill="#CE1126"/>' +
          '<rect y="6" width="24" height="5" fill="#FFFFFF"/>' +
          '<rect y="11" width="24" height="5" fill="#000000"/>' +
          '<rect x="9" y="7" width="6" height="3" rx="0.5" fill="#C09300"/>',

    // Saudi Arabia: green field, white Arabic inscription (simplified) + sword
    'SA': '<rect width="24" height="16" fill="#006C35"/>' +
          '<rect x="3" y="5" width="18" height="1.5" rx="0.4" fill="#FFFFFF"/>' +
          '<rect x="3" y="7" width="18" height="1.5" rx="0.4" fill="#FFFFFF"/>' +
          '<rect x="10" y="9" width="4" height="3" rx="0.3" fill="#FFFFFF"/>',

    // UAE: vertical red stripe (left) + horizontal green/white/black stripes
    'AE': '<rect width="7" height="16" fill="#EF3340"/>' +
          '<rect x="7" width="17" height="6" fill="#00732F"/>' +
          '<rect x="7" y="6" width="17" height="4" fill="#FFFFFF"/>' +
          '<rect x="7" y="10" width="17" height="6" fill="#000000"/>',

    // Oman: vertical red stripe (left), white & red with green square top-left
    'OM': '<rect width="24" height="16" fill="#DB161B"/>' +
          '<rect x="6" width="18" height="7" fill="#FFFFFF"/>' +
          '<rect x="6" y="7" width="18" height="2" fill="#FFFFFF"/>' +
          '<rect x="6" y="9" width="18" height="7" fill="#DB161B"/>' +
          '<rect x="0" y="0" width="6" height="6" fill="#008000"/>',

    // Tanzania: diagonal tricolour black/yellow/green + blue triangles
    'TZ': '<rect width="24" height="16" fill="#1EB53A"/>' +
          '<polygon points="0,0 14,0 0,16" fill="#00A3DD"/>' +
          '<polygon points="24,0 24,16 10,16" fill="#00A3DD"/>' +
          '<polygon points="0,16 0,10 20,0 24,0 24,3 4,16" fill="#000000"/>' +
          '<polygon points="0,13 0,16 6,16 22,0 18,0" fill="#FCD116"/>',

    // Angola: horizontal bicolour Red/Black + yellow gear-machete emblem (simplified)
    'AO': '<rect width="24" height="8" fill="#CC0000"/>' +
          '<rect y="8" width="24" height="8" fill="#000000"/>' +
          '<circle cx="12" cy="8" r="3" fill="none" stroke="#FFCC00" stroke-width="1.2"/>' +
          '<rect x="11.3" y="4.5" width="1.4" height="7" rx="0.3" fill="#FFCC00"/>'
  };

  // Neutral fallback — a simple globe SVG, no emoji
  var FALLBACK_SVG =
    '<circle cx="12" cy="8" r="7" fill="#334"/>' +
    '<ellipse cx="12" cy="8" rx="4" ry="7" fill="none" stroke="#667" stroke-width="0.8"/>' +
    '<line x1="5" y1="8" x2="19" y2="8" stroke="#667" stroke-width="0.8"/>' +
    '<circle cx="12" cy="8" r="7" fill="none" stroke="#556" stroke-width="1"/>';

  var iso2    = NAME_TO_ISO2[countryName];
  var content = iso2 ? (FLAG_SVG[iso2] || FALLBACK_SVG) : FALLBACK_SVG;

  return '<svg xmlns="http://www.w3.org/2000/svg"' +
         ' viewBox="0 0 24 16"' +
         ' width="24" height="16"' +
         ' style="display:inline-block;vertical-align:middle;border-radius:2px;flex-shrink:0;"' +
         ' aria-hidden="true">' +
         content +
         '</svg>';
}

function _statusIcon(status) {
  var icons = {
    'Above Target': '\u2705',
    'Near Target':  '\u26a0\ufe0f',
    'Below Target': '\u274c',
    'N/A':          '\u2139\ufe0f'
  };
  return icons[status] || '\u2014';
}

function _formatTimestamp(isoString) {
  if (!isoString) return '\u2014';
  try {
    var d = new Date(isoString);
    return d.toLocaleDateString('en-GB', {
      day:    '2-digit',
      month:  'short',
      year:   'numeric',
      hour:   '2-digit',
      minute: '2-digit'
    });
  } catch (e) {
    return isoString;
  }
}

// =============================================================================
// 12. APP BOOTSTRAP
// =============================================================================

var App = {
  loadDashboardData: function() {
    return GASClient.call('getDashboardData')
      .then(function(result) {
        if (!result || !result.success) {
          throw new Error((result && result.error) || 'Server returned an invalid response');
        }

        AppState.set('dashboardData', result);

        var todayEl   = document.getElementById('navbar-today');
        var refreshEl = document.getElementById('navbar-refresh');
        var meta      = result.meta || {};

        if (todayEl)   todayEl.textContent   = meta.today    || '\u2014';
        if (refreshEl) refreshEl.textContent = _formatTimestamp(meta.loadedAt);

        FilterManager.init(result.filterOptions);
        OverviewCtrl.render(result.overview);
        NatCtrl.render(result.nationalization);

        if (result.trend) {
          ChartRenderer.render(result.trend);
        } else {
          LoadingManager.showChartLoading();
          ChartRenderer.reload('year', null);
        }
        
        MapRenderer.updatePins(result.overview.mapPins);
      })
      .catch(function(e) {
        console.error('[App] loadDashboardData failed:', e.message);
        ErrorManager.show(
          'Unable to load dashboard. Please verify the Spreadsheet ID in Config.gs. Error: ' + e.message
        );
      });
  },

  init: function() {
    ErrorManager.init();
    Router.init();
    MapRenderer.init();
    return App.loadDashboardData().then(function() {
      LoadingManager.hideLoadingScreen();
    });
  }
};

// =============================================================================
// 13. ENTRY POINT
// =============================================================================

var _appInitialized = false;

function _initApp() {
  if (_appInitialized) return;
  _appInitialized = true;
  App.init().catch(function(err) {
    console.error('[App] Fatal init error:', err);
    LoadingManager.hideLoadingScreen();
    ErrorManager.show('Fatal Error: ' + err.message);
  });
}

if (document.readyState === 'complete') {
  _initApp();
} else {
  window.addEventListener('load', _initApp);
  setTimeout(function() { _initApp(); }, 500);
}
</script>
